name: keuangan_ku
description: Aplikasi keuangan pribadi (pocket, investasi, statistik).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  intl: any
  fl_chart: ^1.2.0
  excel: ^4.0.6
  share_plus: 11.0.0
  path_provider: ^2.1.6
  file_picker: ">=10.0.0 <12.0.0"
  shared_preferences: ^2.5.5
  local_auth: ^3.0.2
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21
